<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md Mohibullah Biswas | Portfolio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f4f2;
            color: #1a1a1a;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Editorial Header Navigation */
        header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e2e2e0;
        }

        .nav-wrapper {
            display: grid;
            grid-template-columns: 80px repeat(4, 1fr);
            align-items: center;
            height: 60px;
        }

        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-left: 24px;
            cursor: pointer;
        }

        .menu-icon span {
            width: 22px;
            height: 2px;
            background-color: #1a1a1a;
        }

        .nav-item {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid #e2e2e0;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: background 0.3s;
        }

        .nav-item:hover {
            background: #fafafa;
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            overflow: hidden;
        }

        /* Oversized Background Typography */
        .hero-title-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4vw;
            z-index: 1;
            pointer-events: none;
            white-space: nowrap;
        }

        .title-part {
            font-family: 'Cinzel', serif;
            font-size: 11vw;
            font-weight: 900;
            color: #111111;
            letter-spacing: -2px;
            line-height: 1;
        }

        /* Center Subject Image */
        .hero-image-wrapper {
            position: relative;
            z-index: 2;
            max-width: 500px;
            width: 80%;
            margin: 0 auto;
        }

        .hero-image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(100%) contrast(110%);
        }

        /* Floating Minimalist Content */
        .hero-content-left {
            position: absolute;
            bottom: 60px;
            left: 60px;
            z-index: 3;
            max-width: 280px;
        }

        .hero-content-left p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #4a4a4a;
            margin-bottom: 24px;
        }

        .btn-editorial {
            display: inline-block;
            background-color: #4b6b75;
            color: #ffffff;
            padding: 12px 28px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            transition: opacity 0.3s;
        }

        .btn-editorial:hover {
            opacity: 0.9;
        }

        .hero-content-right {
            position: absolute;
            bottom: 60px;
            right: 60px;
            z-index: 3;
            max-width: 280px;
            text-align: left;
        }

        .hero-content-right p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #4a4a4a;
            position: relative;
            padding-left: 20px;
        }

        .hero-content-right p::before {
            content: '—';
            position: absolute;
            left: 0;
            color: #1a1a1a;
        }

        /* Mobile Responsiveness */
        @media (max-width: 900px) {
            .nav-wrapper {
                grid-template-columns: 60px repeat(2, 1fr);
            }
            .nav-item:nth-child(n+4) {
                display: none;
            }
            .title-part {
                font-size: 14vw;
            }
            .hero-content-left, .hero-content-right {
                position: relative;
                bottom: 0;
                left: 0;
                right: 0;
                max-width: 100%;
                margin-top: 30px;
            }
            .hero {
                flex-direction: column;
                justify-content: center;
                padding-top: 80px;
            }
        }
    </style>
</head>
<body>

    <!-- Editorial Top Navigation -->
    <header>
        <div class="nav-wrapper">
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <a href="#about" class="nav-item">MISSION</a>
            <a href="#about" class="nav-item">ABOUT</a>
            <a href="#services" class="nav-item">SERVICES</a>
            <a href="#contact" class="nav-item">CONTACT</a>
        </div>
    </header>

    <!-- Main Hero Section -->
    <section class="hero">
        
        <!-- Big Typography Behind Image -->
        <div class="hero-title-bg">
            <span class="title-part">MOHIB</span>
            <span class="title-part">ULLAH</span>
        </div>

        <!-- Center Portrait Image -->
        <div class="hero-image-wrapper">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=1000" alt="Md Mohibullah Biswas">
        </div>

        <!-- Left Column Subtext & Action Button -->
        <div class="hero-content-left">
            <p>Sometimes the boldest thing you can do is simply start building your story.</p>
            <a href="#contact" class="btn-editorial">[ CONTACT ]</a>
        </div>

        <!-- Right Column Subtext -->
        <div class="hero-content-right">
            <p>Crafting high-retention video narratives, premium design assets, and digital strategies.</p>
        </div>

    </section>

</body>
</html>
